name: pragmatic-jvm-demo-runtime

services:
  application:
    image: ${APP_IMAGE:-pragmatic-jvm-demo:local}
    pull_policy: never
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DATABASE_NAME:?Set DATABASE_NAME}
      SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8081}:8081"

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USERNAME:?Set DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username ${DATABASE_USERNAME:?Set DATABASE_USERNAME} --dbname ${DATABASE_NAME:?Set DATABASE_NAME}"]
      interval: 2s
      timeout: 5s
      retries: 10
