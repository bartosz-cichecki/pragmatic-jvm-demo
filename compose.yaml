name: pragmatic-jvm-demo-development

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: pragmatic_jvm_demo
      POSTGRES_USER: pragmatic_jvm_demo
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-0}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username pragmatic_jvm_demo --dbname pragmatic_jvm_demo"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
